<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSRF testing</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Francois+One&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins">
    <script defer src="./js/script.js"></script>
    <style>
        .form-input-container {
            display: block;
            padding: 5px;
        }
        .form-input-container label {
            display: inline-block;
            width: 15%;
        }
        .form-input-container input {
            width: 15%;
        }
    </style>
</head>

<body>
    <h1>Hello World!</h1>
    <div class="form-input-container">
        <label for="target-url">Target URL: </label>
        <input type="text" id="target-url" value="http://localhost:9000/json">
    </div>
    <div class="form-input-container">
        <label for="request-count">Number of requests: </label>
        <input type="number" id="request-count" step="1" min="0" value="10">
    </div>
    <button type="button" id="click-me-btn">Click Me!</button>
    <p id="output"></p>
</body>
</html>
